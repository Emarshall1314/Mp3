[package]
name = "cadenza-library"
description = "The library catalogue: SQLite database, scanner, artwork cache, albums and search."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8"
chardetng = "1.0"
encoding_rs = "0.8"
cadenza-tags = { path = "../tags" }
crossbeam-channel = "0.5"
fast_image_resize = { version = "6.1", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
rayon = "1.12"
rusqlite = { version = "0.40", features = ["bundled"] }
serde.workspace = true
thiserror = "2"
unicode-normalization = "0.1"
uuid = { version = "1.28", features = ["v7"] }

[dev-dependencies]
cadenza-testkit = { path = "../testkit" }
tempfile = "3"

[lints]
workspace = true
