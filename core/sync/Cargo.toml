[package]
name = "cadenza-sync"
description = "Sync between devices without a server: clock, op log, segments, stores and merge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
ciborium = "0.2"
hmac = "0.12"
ruzstd = "0.9"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1.28", features = ["v7"] }

[dev-dependencies]
proptest = "1.12"
tempfile = "3"

[lints]
workspace = true
