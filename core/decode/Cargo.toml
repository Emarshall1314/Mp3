[package]
name = "cadenza-decode"
description = "Decoders for every supported format, with gapless trimming and DSD conversion."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
symphonia = { version = "0.6", default-features = false, features = ["flac", "alac", "pcm", "wav", "aiff", "caf", "mp3", "aac", "isomp4", "ogg", "vorbis", "ape", "opt-simd"] }
thiserror = "2"
ape-decoder = "0.3"
opus = "0.4"
ogg = "0.9"

[build-dependencies]
cc = "1"

[dev-dependencies]
cadenza-testkit = { path = "../testkit" }
md-5 = "0.10"

[lints]
workspace = true
