name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (checks, tests, bundle)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: sudo tools/setup-linux.sh
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: fmt, clippy, lint, typecheck, fixtures + self-check, tests
        run: cargo xtask ci
      - name: Bundle (.deb, AppImage)
        run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: cadenza-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  android:
    name: Android (APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The runner image ships the Android SDK and NDK.
      - name: Generate Android project
        run: pnpm --filter @cadenza/app tauri android init --ci
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
      - name: Build APK (arm64)
        run: pnpm --filter @cadenza/app tauri android build --apk --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
      - uses: actions/upload-artifact@v7
        with:
          name: cadenza-android
          path: apps/cadenza/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
