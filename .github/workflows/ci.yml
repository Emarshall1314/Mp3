name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (checks, tests, bundle)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        # A stalled package mirror once held a run here for half an hour.
        timeout-minutes: 10
        run: sudo tools/setup-linux.sh
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: fmt, clippy, lint, typecheck, fixtures + self-check, tests
        run: tools/ci-step.sh cargo xtask ci
      - name: Bundle (.deb, AppImage)
        run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: cadenza-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  android:
    name: Android (APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The runner image ships the Android SDK and NDK. Its variables are only visible to the
      # shell (not to `${{ env }}`), so NDK_HOME is set inside each step. ANDROID_NDK_HOME is for
      # libopus's bundled CMake build.
      - name: Generate Android project
        run: NDK_HOME="$ANDROID_NDK_LATEST_HOME" tools/ci-step.sh pnpm --filter @cadenza/app tauri android init --ci
      - name: Build APK (arm64)
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME" ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          tools/ci-step.sh pnpm --filter @cadenza/app tauri android build --apk --target aarch64
      # Android installs only signed APKs. With the ANDROID_KEYSTORE (base64 .jks) and
      # ANDROID_KEYSTORE_PASSWORD secrets set, every build is signed with the same key and updates
      # in place. Without them a throwaway key is generated, so installing a newer build means
      # uninstalling the old one first (which clears the app's library database).
      - name: Sign APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          apk=$(find apps/cadenza/src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk' | head -1)
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/cadenza.jks"
          else
            echo "::warning::No ANDROID_KEYSTORE secret: signing with a throwaway key"
            KEYSTORE_PASSWORD=throwaway
            keytool -genkeypair -keystore "$RUNNER_TEMP/cadenza.jks" -storepass "$KEYSTORE_PASSWORD" \
              -alias cadenza -keyalg RSA -keysize 3072 -validity 10000 -dname CN=Cadenza
          fi
          mkdir -p dist
          "$tools/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/cadenza.jks" --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --out dist/cadenza-arm64.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify dist/cadenza-arm64.apk
      # The Android pieces live in a plugin and are found by name at run time (JNI, the manifest),
      # so a build that silently left them out would still succeed. Check the APK itself.
      - name: Check APK contents
        run: |
          apk=dist/cadenza-arm64.apk
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          manifest=$("$tools/aapt2" dump xmltree --file AndroidManifest.xml "$apk")
          for want in app.cadenza.android.PlaybackService foregroundServiceType \
            android.permission.MANAGE_EXTERNAL_STORAGE \
            android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK; do
            echo "$manifest" | grep -q "$want" || { echo "::error::manifest lacks $want"; exit 1; }
          done
          dex=$(unzip -p "$apk" 'classes*.dex' | strings)
          for class in PlaybackService CadenzaPlugin MediaBridge; do
            echo "$dex" | grep -q "Lapp/cadenza/android/$class;" \
              || { echo "::error::$class missing from the APK"; exit 1; }
          done
          unzip -p "$apk" lib/arm64-v8a/libcadenza_app_lib.so > "$RUNNER_TEMP/lib.so"
          nm=$(ls "$ANDROID_NDK_LATEST_HOME"/toolchains/llvm/prebuilt/*/bin/llvm-nm | head -1)
          exports=$("$nm" -D --defined-only "$RUNNER_TEMP/lib.so")
          for fn in command ready waitState; do
            echo "$exports" | grep -q "Java_app_cadenza_android_MediaBridge_$fn" \
              || { echo "::error::libcadenza_app_lib.so does not export MediaBridge.$fn"; exit 1; }
          done
          echo "APK has the playback service, the plugin classes and the JNI bridge."
      - uses: actions/upload-artifact@v7
        with:
          name: cadenza-android
          path: dist/cadenza-arm64.apk
