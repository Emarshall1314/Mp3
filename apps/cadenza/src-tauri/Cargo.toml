[package]
name = "cadenza-app"
description = "Cadenza Tauri shell (Linux desktop + Android)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The staticlib/cdylib types are required for the Android build.
name = "cadenza_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
cadenza-api.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-cadenza-android = { path = "../plugins/android" }

[features]
# Set by the Tauri CLI for production builds: serve the bundled UI instead of the dev server.
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
souvlaki = "0.8"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
